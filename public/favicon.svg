<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Radial Gradient (Glossy Emerald Pin) -->
    <radialGradient id="pinBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="35%" stop-color="#15803d" />
      <stop offset="70%" stop-color="#0e5328" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>

    <!-- Glossy Curved Glass Sheen -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Button Body -->
  <circle cx="256" cy="256" r="248" fill="url(#pinBg)" filter="url(#subtleShadow)" />
  <circle cx="256" cy="256" r="244" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.2" fill="none" />

  <!-- Top Glass Highlight Reflection -->
  <path d="M 40 220 C 45 110, 140 24, 256 24 C 372 24, 467 110, 472 220 C 370 170, 142 170, 40 220 Z" fill="url(#gloss)" />

  <!-- Mint Green Leaf Accent (Lower Left Curve) -->
  <path d="M 126 330 C 130 380, 165 425, 230 425 C 275 425, 315 390, 318 350 C 300 375, 260 385, 220 380 C 170 375, 135 345, 126 330 Z" fill="#86efac" />
  <path d="M 172 285 C 135 300, 122 340, 135 380 C 150 415, 195 425, 240 420 C 210 415, 180 395, 168 365 C 158 340, 160 310, 172 285 Z" fill="#4ade80" opacity="0.9" />

  <!-- The "i" Upper Dot -->
  <circle cx="256" cy="112" r="36" fill="#ffffff" />

  <!-- The Elegant Intertwined "S" Spine in Pure White -->
  <path d="M 256 150 C 275 160, 282 178, 276 200 C 265 235, 215 250, 192 280 C 160 320, 170 385, 215 425 C 265 465, 335 450, 368 400 C 382 378, 385 350, 382 320 C 375 250, 305 230, 275 205 C 248 185, 246 168, 256 150 Z" fill="#ffffff" />
  <path d="M 256 150 C 242 165, 235 185, 240 205 C 250 240, 310 260, 335 300 C 360 340, 350 400, 300 435 C 345 405, 365 350, 350 305 C 335 265, 280 245, 265 210 C 255 185, 255 165, 256 150 Z" fill="#ffffff" />
</svg>
